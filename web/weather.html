<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气显示</title>
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('epd_theme')||'loopy')})()</script>
<style>
[data-theme="loopy"]{--bg:#FFF0F5;--g1:rgba(255,182,203,.32);--g2:rgba(173,216,250,.28);--cd:#fff;--cb:rgba(255,155,179,.22);--ch:rgba(255,155,179,.10);--cs:0 6px 28px rgba(255,155,179,.13);--sf:rgba(255,236,245,.75);--sb:rgba(255,155,179,.20);--tx:#5A3050;--t2:rgba(120,70,100,.62);--ac:#FF9BB3;--a2:#8CC8F0;--ag:rgba(255,155,179,.28);--bt:#fff;--ok:#2E9E52;--er:#E53935;--wn:#E68A00;--hv:rgba(255,155,179,.10);--tg:rgba(255,155,179,.22)}
[data-theme="kitty"]{--bg:#FFF8F8;--g1:rgba(255,77,109,.18);--g2:rgba(255,215,0,.14);--cd:#fff;--cb:rgba(255,77,109,.17);--ch:rgba(255,77,109,.07);--cs:0 6px 28px rgba(255,77,109,.10);--sf:rgba(255,245,247,.8);--sb:rgba(255,77,109,.14);--tx:#4A1525;--t2:rgba(130,50,70,.58);--ac:#FF4D6D;--a2:#FFB347;--ag:rgba(255,77,109,.24);--bt:#fff;--ok:#2E9E52;--er:#D32F2F;--wn:#E68A00;--hv:rgba(255,77,109,.07);--tg:rgba(255,77,109,.15)}
[data-theme="lotso"]{--bg:#FBF0F3;--g1:rgba(183,70,120,.20);--g2:rgba(232,160,184,.18);--cd:#fff;--cb:rgba(183,70,120,.17);--ch:rgba(183,70,120,.07);--cs:0 6px 28px rgba(183,70,120,.10);--sf:rgba(251,238,244,.8);--sb:rgba(183,70,120,.14);--tx:#4A1428;--t2:rgba(120,40,70,.58);--ac:#B74678;--a2:#E8A0B8;--ag:rgba(183,70,120,.24);--bt:#fff;--ok:#2E9E52;--er:#C62828;--wn:#E68A00;--hv:rgba(183,70,120,.07);--tg:rgba(183,70,120,.15)}
*{box-sizing:border-box;transition:background-color .35s,border-color .35s,color .3s,box-shadow .35s}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:radial-gradient(1200px 800px at 20% -10%,var(--g1),transparent 60%),radial-gradient(900px 600px at 100% 0%,var(--g2),transparent 55%),var(--bg);color:var(--tx);min-height:100vh;overflow-y:scroll}
.wrap{width:min(1180px,calc(100vw - 32px));max-width:1180px;margin:0 auto;padding:24px 0 36px}
.hdr{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:46px;margin:0 0 16px;flex-wrap:wrap}
.title{font-weight:800;letter-spacing:.2px;font-size:20px;line-height:1.25}.sub{color:var(--t2);font-size:13px;line-height:1.5}
.nav{width:min(1180px,100%);display:flex;align-items:center;gap:8px;margin:0 auto 20px;padding:8px;overflow-x:auto;flex-wrap:nowrap;border-radius:18px;background:rgba(255,255,255,.60);border:1px solid var(--cb);box-shadow:0 8px 22px rgba(255,155,179,.10);scrollbar-width:none;-webkit-overflow-scrolling:touch;justify-content:center}
.nav::-webkit-scrollbar{display:none}.nav a{flex:0 0 88px;width:88px;min-width:88px;max-width:88px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;border-radius:12px;font-size:13px;font-weight:800;line-height:1;color:var(--tx);background:rgba(255,255,255,.78);border:1px solid var(--cb);text-decoration:none;white-space:nowrap;overflow:hidden;box-shadow:0 4px 12px rgba(255,155,179,.08)}
.nav .ni{width:18px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1}.nav a:hover,.nav a.active{color:var(--ac);border-color:var(--ac);background:var(--hv);transform:translateY(-1px);box-shadow:0 0 0 2px var(--ag)}
.card{position:relative;width:100%;background:var(--cd);border:1px solid var(--cb);border-radius:16px;overflow:hidden;box-shadow:var(--cs);margin-bottom:16px}.card .hd{padding:20px 22px 12px;background:linear-gradient(180deg,var(--ch),transparent)}
.card .bd{padding:18px 22px 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;align-items:start}
.kv{grid-column:1/-1;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px;margin-bottom:4px}.k{color:var(--t2)}.v{font-weight:700}.ok{color:var(--ok)}.bad{color:var(--er)}.warn{color:var(--wn)}
.row{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.form-row{margin-bottom:0}.form-row label{display:block;font-size:12px;color:var(--t2);margin-bottom:4px}
.btn{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;color:var(--bt);background:linear-gradient(135deg,var(--ac),var(--a2));box-shadow:0 6px 20px var(--ag);transition:filter .2s,transform .15s}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn.ghost{background:var(--sf);color:var(--tx);border:1px solid var(--cb);box-shadow:none}.btn.ghost:hover{background:var(--hv);border-color:var(--ac)}.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;filter:none}
.log{grid-column:1/-1;margin-top:4px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;background:var(--sf);border:1px solid var(--sb);border-radius:12px;padding:10px;min-height:48px;white-space:pre-wrap}
select,input[type=text]{padding:10px 12px;background:var(--sf);border:1px solid var(--sb);color:var(--tx);border-radius:12px;font-size:14px;width:100%;max-width:none;font-family:inherit}select:focus,input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ag)}
.toggle{position:relative;display:inline-block;width:44px;height:24px;vertical-align:middle}.toggle input{opacity:0;width:0;height:0;position:absolute}.toggle .sl{position:absolute;cursor:pointer;inset:0;background:var(--tg);border-radius:24px;transition:.3s}.toggle .sl:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:var(--cd);border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.15)}.toggle input:checked+.sl{background:var(--ac)}.toggle input:checked+.sl:before{transform:translateX(20px)}
.checkline{display:flex!important;align-items:center;gap:8px;margin-top:8px!important;font-size:12px!important;color:var(--t2)!important}.checkline input{width:auto}
.hidden{display:none!important}.epd-credit{width:100%;margin-top:20px;padding-top:14px;border-top:1px solid var(--cb);font-size:12px;color:var(--t2);text-align:center;line-height:1.6}.epd-credit strong{color:var(--tx);font-weight:700}.epd-credit a{color:var(--ac);font-weight:600;text-decoration:none}.epd-credit a:hover{text-decoration:underline}
@media(max-width:760px){.wrap{width:calc(100vw - 24px);padding:16px 0 28px}.nav{margin-bottom:16px;justify-content:flex-start;padding:7px;gap:7px;border-radius:16px}.nav a{min-height:36px;padding:0 11px;font-size:12px}.card .bd{grid-template-columns:1fr}.kv{grid-template-columns:92px 1fr}}
</style>
</head>
<body class="page-shell page-panel page-weather">
<div class="wrap">
  <div class="hdr"><div class="title">天气显示</div></div>
  <div class="nav">
    <a href="/"><span class="ni">🖼</span> 上传</a>
    <a href="/gallery"><span class="ni">🔁</span> 轮播</a>
    <a href="/weather" class="active"><span class="ni">🌤</span> 天气</a>
    <a href="/clock"><span class="ni">🕐</span> 时钟</a>
    <a href="/calendar"><span class="ni">🗓</span> 日历</a>
    <a href="/timetable"><span class="ni">📅</span> 课程表</a>
    <a href="/todo"><span class="ni">✅</span> 待办</a>
    <a href="/countdown"><span class="ni">⏳</span> 倒计时</a>
    <a href="/message"><span class="ni">💬</span> 文字留言</a>
    <a href="/board"><span class="ni">🎨</span> 画布留言</a>
    <a href="/codex"><span class="ni">📊</span> 额度</a>
    <a href="/config"><span class="ni">⚙</span> 设置</a>
  </div>

  <div class="card">
    <div class="hd">
      <div class="title" style="font-size:16px">天气显示</div>
      <div class="sub">可选择 Open-Meteo 城市直查，或使用原来的和风天气 API。</div>
    </div>
    <div class="bd">
      <div class="kv">
        <div class="k">天气状态</div><div class="v" id="w_status">-</div>
        <div class="k">最新数据</div><div class="v" id="w_data">-</div>
        <div class="k">当前来源</div><div class="v" id="w_source">-</div>
        <div class="k" id="wGeoLabel">定位</div><div class="v" id="w_geo">-</div>
      </div>

      <div class="form-row">
        <label>启用天气</label>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:4px">
          <span class="toggle"><input type="checkbox" id="wEnabled"><span class="sl"></span></span>
          <span id="wLabel" style="font-size:13px">已关闭</span>
        </label>
      </div>
      <div class="form-row">
        <label>天气源</label>
        <select id="wProvider">
          <option value="open_meteo">Open-Meteo 城市直查</option>
          <option value="qweather">和风天气 API</option>
        </select>
      </div>
      <div class="form-row">
        <label id="wCityLabel">城市</label>
        <input type="text" id="wCity" placeholder="北京 / 上海 / Hangzhou" autocomplete="off">
      </div>
      <div class="form-row qweather-only hidden">
        <label>API Key（留空表示保留已保存 Key）</label>
        <input type="text" id="wApiKey" placeholder="在 dev.qweather.com 获取">
        <label class="checkline"><input type="checkbox" id="wApiKeyClear"> 清除已保存的 Key</label>
      </div>
      <div class="form-row qweather-only hidden">
        <label>API Host（不含 https://）</label>
        <input type="text" id="wApiHost" placeholder="xxx.re.qweatherapi.com">
      </div>
      <div class="form-row qweather-only hidden">
        <label>Location ID 或经纬度</label>
        <input type="text" id="wLocation" placeholder="101010100">
      </div>
      <div class="form-row">
        <label>天气刷新策略</label>
        <select id="wRefresh">
          <option value="0">仅手动</option>
          <option value="30">自动：常开 30 分钟，低功耗按唤醒间隔</option>
        </select>
      </div>
      <div class="row">
        <button class="btn" onclick="queryWeather()">查询并显示</button>
        <button class="btn ghost sm" onclick="saveWeather()">保存设置</button>
        <button class="btn ghost sm" onclick="loadWeather()">刷新</button>
      </div>
      <div class="log" id="wLog">加载中…</div>
    </div>
  </div>
  <footer class="epd-credit" role="contentinfo">由 <strong>喵喵</strong> 设计并开发 · 智能墨水屏终端 · <a href="https://gitee.com/gxp666111/miaomiao" target="_blank" rel="noopener noreferrer">源码仓库</a></footer>
</div>
<script>
function epdAuthHeaders(){try{var u=localStorage.getItem('epd_auth_u');var p=localStorage.getItem('epd_auth_p');if(u!=null&&p!=null&&u!==''&&p!=='')return {'Authorization':'Basic '+btoa(unescape(encodeURIComponent(u+':'+p)))};}catch(e){}return {};}
function epdFetchOpts(extra){extra=extra||{};var h=Object.assign({},epdAuthHeaders(),extra.headers||{});return Object.assign({},extra,{headers:h});}
function wLog(s,cls){const el=document.getElementById('wLog');el.className='log'+(cls?' '+cls:'');el.textContent=s;}
async function fetchJsonRetry(url,options,retries,delayMs){retries=retries===undefined?4:retries;delayMs=delayMs===undefined?400:delayMs;let last;for(let i=0;i<retries;i++){try{const r=await fetch(url,epdFetchOpts(options));if(!r.ok) throw new Error('HTTP '+r.status);return await r.json();}catch(e){last=e;if(i<retries-1) await new Promise(function(res){setTimeout(res,delayMs*(i+1));});}}throw last;}
let weatherHydrating=false,weatherAutoSaveTimer=null,weatherSaveInFlight=false,weatherApiKeyConfigured=false,loadedProvider='open_meteo';
function providerLabel(p){return p==='qweather'?'和风天气':'Open-Meteo';}
function normalizeHost(s){return (s||'').trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');}
function weatherTimezoneLabel(tz){if(!tz||tz==='auto')return '';return tz==='Asia/Shanghai'?'中国标准时间':tz;}
function weatherGeoReady(j,p){return p==='qweather'?!!(j.api_host&&j.location):!!j.location;}
function weatherGeoText(j,p){if(p==='qweather')return (j.api_host||'未配置')+(j.location?' · Location '+j.location:'');var parts=[];if(j.city_name)parts.push('城市：'+j.city_name);if(j.location)parts.push('坐标：'+j.location);else parts.push('坐标：待查询');var tz=weatherTimezoneLabel(j.timezone);if(tz)parts.push('时区：'+tz);return parts.join(' · ');}
function applyProviderUI(fromUser){var p=document.getElementById('wProvider').value;document.querySelectorAll('.qweather-only').forEach(function(el){el.classList.toggle('hidden',p!=='qweather');});document.getElementById('wCityLabel').textContent=p==='qweather'?'城市名称（显示用，可选）':'城市';document.getElementById('wCity').placeholder=p==='qweather'?'北京':'北京 / 上海 / Hangzhou';if(fromUser&&p==='qweather'&&loadedProvider!=='qweather'){document.getElementById('wApiHost').value='';document.getElementById('wLocation').value='';}}
function collectWeatherCfg(){var p=document.getElementById('wProvider').value;var cfg={enabled:document.getElementById('wEnabled').checked,provider:p,city_name:document.getElementById('wCity').value.trim(),refresh_min:parseInt(document.getElementById('wRefresh').value,10)||0};if(p==='qweather'){cfg.api_key=document.getElementById('wApiKey').value.trim();cfg.api_key_clear=document.getElementById('wApiKeyClear').checked;cfg.api_host=normalizeHost(document.getElementById('wApiHost').value);cfg.location=document.getElementById('wLocation').value.trim();if(!cfg.api_key&&weatherApiKeyConfigured&&!cfg.api_key_clear)delete cfg.api_key;}return cfg;}
function cfgReady(cfg){if(!cfg.enabled)return true;if(cfg.provider==='qweather')return (!!cfg.api_key||weatherApiKeyConfigured)&&!cfg.api_key_clear&&!!cfg.api_host&&!!cfg.location;return !!cfg.city_name;}
function cfgMissingText(cfg){return cfg.provider==='qweather'?'请填写和风 API Key、API Host 和 Location ID':'请填写城市名';}
function scheduleWeatherAutoSave(){if(weatherHydrating||weatherSaveInFlight)return;clearTimeout(weatherAutoSaveTimer);weatherAutoSaveTimer=setTimeout(function(){weatherAutoSaveTimer=null;var cfg=collectWeatherCfg();if(!cfgReady(cfg))return;saveWeather({silent:true});},2000);}
async function loadWeather(){try{weatherHydrating=true;const j=await fetchJsonRetry('/weather_config');loadedProvider=j.provider||'open_meteo';weatherApiKeyConfigured=!!j.api_key_set;document.getElementById('wEnabled').checked=!!j.enabled;document.getElementById('wLabel').textContent=j.enabled?'已开启':'已关闭';document.getElementById('wProvider').value=loadedProvider;document.getElementById('wCity').value=j.city_name||'';document.getElementById('wRefresh').value=String(j.refresh_min?30:0);document.getElementById('wApiKey').value='';document.getElementById('wApiKey').placeholder=weatherApiKeyConfigured?'已保存，留空不修改':'和风天气 API Key';document.getElementById('wApiKeyClear').checked=false;document.getElementById('wApiHost').value=j.api_host||'';document.getElementById('wLocation').value=j.location||'';applyProviderUI(false);const st=document.getElementById('w_status');if(j.enabled&&((loadedProvider==='qweather'&&j.location&&j.api_host&&weatherApiKeyConfigured)||(loadedProvider!=='qweather'&&j.city_name))){st.textContent='运行中';st.className='v ok';}else if(j.enabled){st.textContent='等待配置';st.className='v warn';}else{st.textContent='已关闭';st.className='v warn';}const wd=document.getElementById('w_data');if(j.has_data){wd.textContent=j.temp+'°C '+j.text+' ('+(j.update_time||'--')+')';wd.className='v';}else{wd.textContent='暂无数据';wd.className='v warn';}document.getElementById('w_source').textContent=providerLabel(loadedProvider);const geo=document.getElementById('w_geo');const geoLabel=document.getElementById('wGeoLabel');if(geoLabel)geoLabel.textContent=loadedProvider==='qweather'?'Host/Location':'定位';geo.textContent=weatherGeoText(j,loadedProvider);geo.className=weatherGeoReady(j,loadedProvider)?'v':'v warn';wLog('设置已加载。');}catch(e){wLog('加载失败: '+e,'bad');}finally{weatherHydrating=false;}}
async function saveWeather(opts){opts=opts||{};var silent=opts.silent===true;var cfg=collectWeatherCfg();if(!cfgReady(cfg)){if(!silent)wLog(cfgMissingText(cfg),'bad');return false;}wLog(silent?'自动保存中…':'保存中…');weatherSaveInFlight=true;try{var j=await fetchJsonRetry('/weather_config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)},3,500);if(j.ok){if(!opts.noReload)await loadWeather();wLog(silent?'已自动保存。':'设置已保存。','ok');return true;}wLog('保存失败','bad');return false;}catch(e){wLog('请求失败: '+e,'bad');return false;}finally{weatherSaveInFlight=false;}}
async function showWeather(){wLog('正在获取天气并渲染…墨水屏刷新需要一点时间');var ctrl=new AbortController();var t=setTimeout(function(){ctrl.abort();},120000);try{const r=await fetch('/weather_show',epdFetchOpts({method:'POST',signal:ctrl.signal}));const j=await r.json();if(j.ok){wLog('天气已显示在墨水屏上。','ok');await loadWeather();return true;}wLog('获取天气失败，请检查当前天气源配置和网络。','bad');return false;}catch(e){wLog('请求失败: '+(e.name==='AbortError'?'超时，墨水屏可能仍在刷新':e),'bad');return false;}finally{clearTimeout(t);}}
async function queryWeather(){var cfg=collectWeatherCfg();cfg.enabled=true;if(!cfgReady(cfg)){wLog(cfgMissingText(cfg),'bad');return;}document.getElementById('wEnabled').checked=true;document.getElementById('wLabel').textContent='已开启';var ok=await saveWeather({silent:true,noReload:true});if(ok)await showWeather();}
(function(){['wEnabled','wProvider','wCity','wRefresh','wApiKey','wApiKeyClear','wApiHost','wLocation'].forEach(function(id){var el=document.getElementById(id);if(!el)return;var ev=(el.tagName==='SELECT'||el.type==='checkbox')?'change':'input';el.addEventListener(ev,function(){if(id==='wEnabled')document.getElementById('wLabel').textContent=el.checked?'已开启':'已关闭';if(id==='wProvider')applyProviderUI(true);scheduleWeatherAutoSave();});});})();
loadWeather();
</script>
</body>
</html>
