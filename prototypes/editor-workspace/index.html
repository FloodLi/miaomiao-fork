<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MiaooAim · 图片工作区样稿</title>
  <link rel="icon" href="/assets/brand.png" type="image/png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="app-header">
  <div class="brand"><a class="icon-button" href="/" aria-label="返回样稿入口" title="返回样稿入口"><img src="/icons/arrow-left.svg" alt=""></a><img class="brand-mark" src="/assets/brand.png" alt=""><strong>MiaooAim</strong><span class="header-caption">图片工作区</span></div>
  <label class="panel-picker"><span>预览屏幕</span><select id="panelSelect" aria-label="预览屏幕" disabled><option>正在读取屏幕…</option></select></label>
  <div class="connection"><span class="status-dot"></span><span>本地模拟</span><button id="about" class="icon-button" aria-label="样稿信息" title="样稿信息"><img src="/icons/info.svg" alt=""></button></div>
</header>
<nav class="command-bar" aria-label="编辑操作">
  <div class="file-actions"><button id="openFile" class="text-button"><img src="/icons/folder-open.svg" alt="">选择图片</button><input id="file" type="file" accept="image/jpeg,image/png,image/bmp" hidden><select id="sampleSelect" aria-label="测试素材"><option value="photo">测试图片</option><option value="chart">色阶测试</option><option value="qr">二维码</option></select><span id="fileName" class="file-name">未选择图片</span></div>
  <div class="edit-actions"><span class="separator"></span><button id="undo" class="icon-button" title="撤销" aria-label="撤销" disabled><img src="/icons/undo-2.svg" alt=""></button><button id="redo" class="icon-button" title="重做" aria-label="重做" disabled><img src="/icons/redo-2.svg" alt=""></button><button id="reset" class="icon-button" title="重置调色与构图" aria-label="重置调色与构图"><img src="/icons/rotate-ccw.svg" alt=""></button></div>
  <div class="send-actions"><button id="download" class="icon-button" title="导出当前PNG" aria-label="导出当前PNG" disabled><img src="/icons/download.svg" alt=""></button><button id="upload" class="primary-button" disabled><img src="/icons/upload.svg" alt="">模拟上传</button><button id="toggleSidebar" class="icon-button" title="收起参数栏" aria-label="收起参数栏" aria-expanded="true"><img src="/icons/panel-right-close.svg" alt=""></button></div>
</nav>
<main id="workspace">
  <aside class="tool-rail" aria-label="画布工具"><button id="panTool" class="icon-button active" aria-pressed="true" title="查看与平移" aria-label="查看与平移"><img src="/icons/hand.svg" alt=""></button><button id="cropTool" class="icon-button" aria-pressed="false" title="拖动取景（铺满裁剪）" aria-label="拖动取景" disabled><img src="/icons/crop.svg" alt=""></button><span class="rail-divider"></span><button id="fitView" class="icon-button" title="适应工作区" aria-label="适应工作区"><img src="/icons/scan.svg" alt=""></button><button id="actualView" class="icon-button tiny-type" title="100%像素" aria-label="100%像素">1:1</button><button id="compare" class="icon-button" aria-pressed="false" title="按住查看同一构图的原图" aria-label="按住查看原图"><img src="/icons/eye.svg" alt=""></button></aside>
  <section class="canvas-area" aria-label="图片预览">
    <div class="canvas-toolbar"><span class="canvas-title" id="canvasTitle">图像预览</span><div class="view-tabs" id="viewTabs"><button data-view="effect" class="active" aria-pressed="true">效果</button><button data-view="pixels" aria-pressed="false">点阵</button></div><span class="compare-label" id="compareLabel" hidden>原图</span></div>
    <div id="viewport" tabindex="0" aria-label="可平移的预览画布"><div id="surface"><canvas id="display" aria-label="实时图像预览"></canvas></div><div id="empty" hidden>请选择图片</div></div>
    <div class="canvas-status"><span id="geometry">—</span><div class="zoom-actions"><button id="zoomOut" class="icon-button" title="缩小观看比例" aria-label="缩小观看比例"><img src="/icons/zoom-out.svg" alt=""></button><select id="zoomSelect" aria-label="观看比例"><option value="fit">适应</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option><option value="300">300%</option><option value="400">400%</option></select><button id="zoomIn" class="icon-button" title="放大观看比例" aria-label="放大观看比例"><img src="/icons/zoom-in.svg" alt=""></button></div></div>
  </section>
  <div id="splitter" role="separator" tabindex="0" aria-label="参数栏宽度" aria-orientation="vertical" aria-valuemin="260" aria-valuemax="380" aria-valuenow="300"></div>
  <aside id="inspector" aria-label="图片参数">
    <div class="inspector-header"><div class="inspector-tabs" role="tablist" aria-label="参数分组"><button id="tabAdjust" data-tab="adjust" role="tab" aria-controls="adjustTab" class="active" aria-selected="true">调整</button><button id="tabCompose" data-tab="compose" role="tab" aria-controls="composeTab" tabindex="-1" aria-selected="false">构图</button></div><button id="resetTab" class="icon-button" title="重置当前分组" aria-label="重置当前分组"><img src="/icons/rotate-ccw.svg" alt=""></button></div>
    <div id="parameterScroll">
      <section id="adjustTab"><div class="control-section"><div class="section-heading"><h2>输出模式</h2><div id="inkSwatches" aria-label="允许墨色"></div></div><div id="modeTabs" class="mode-tabs"><button data-mode="color">色彩</button><button data-mode="mono">黑白</button><button data-mode="text">文字</button></div></div><div id="basicControls" class="control-section"></div><details id="advanced" class="control-section"><summary>高级调整</summary><div id="advancedControls"></div><div id="patternRow" class="select-row"><label for="pattern">点阵排列</label><select id="pattern"><option value="soft">柔化纹理</option><option value="regular">标准扩散</option></select></div></details></section>
      <section id="composeTab" hidden><div class="control-section"><h2>画面适配</h2><select id="fitMode" aria-label="画面适配"><option value="contain">完整显示</option><option value="cover">铺满裁剪</option><option value="stretch">拉伸铺满</option></select><div class="slider-row" id="cropZoomRow"><label for="cropZoom">构图缩放 <output id="cropZoomValue">1.00×</output></label><div class="slider-input"><input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1"><button id="resetCropZoom" class="icon-button reset-control" title="重置构图缩放" aria-label="重置构图缩放"><img src="/icons/rotate-ccw.svg" alt=""></button></div></div><button id="centerCrop" class="secondary-button">取景居中</button></div><div class="control-section"><h2>方向</h2><div id="rotationTabs" class="mode-tabs"><button data-rot="0">0°</button><button data-rot="90">90°</button><button data-rot="180">180°</button><button data-rot="270">270°</button></div><label class="check-row"><input type="checkbox" id="flipX">水平镜像</label><label class="check-row"><input type="checkbox" id="flipY">垂直镜像</label></div></section>
    </div>
    <div class="inspector-footer"><span id="profileLabel">读取中</span><span>参考预览 · 未实屏校色</span></div>
  </aside>
</main>
<footer class="app-status"><span id="status" role="status">正在初始化…</span><span id="modeStatus">不会访问真实设备</span></footer>
<dialog id="aboutDialog"><div class="dialog-title"><h2>本地交互样稿</h2><button id="closeAbout" class="icon-button" aria-label="关闭"><img src="/icons/x.svg" alt=""></button></div><p>当前使用模拟屏幕。未连接设备，不保存设备配置，不执行真实刷屏。</p><p>7.5寸JD79665保留当前参数，4.2寸JD79668开始独立四色测试。其余型号、多屏固件接入与实屏校准仍待后续验证。</p><p id="catalogInfo"></p></dialog>
<script src="/processor.js"></script><script src="/legacy.js"></script><script src="/app.js"></script>
</body></html>
